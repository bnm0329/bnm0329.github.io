<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mr Bnm Uploader – TikTok sign-in</title>
<style>
  body { font: 16px/1.6 system-ui, "Segoe UI", sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #1b1e27; }
  code { display: block; word-break: break-all; background: #f1f2f6; padding: 12px; border-radius: 8px; font-size: 15px; }
  button { margin-top: 12px; padding: 10px 18px; font-size: 16px; border-radius: 8px; border: 0; background: #1b1e27; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<h1>Mr Bnm Uploader – TikTok sign-in</h1>
<p id="msg">Reading the sign-in result…</p>
<code id="code" hidden></code>
<button id="copy" hidden>Copy code</button>
<p>Paste this code into the terminal window that is waiting for it. Do not share it with anyone; it expires in a few minutes.</p>
<script>
  const q = new URLSearchParams(location.search);
  const code = q.get("code"), err = q.get("error");
  const msg = document.getElementById("msg"), box = document.getElementById("code"), btn = document.getElementById("copy");
  if (code) {
    msg.textContent = "Signed in. Your one-time code:";
    box.textContent = code; box.hidden = false; btn.hidden = false;
    btn.onclick = () => navigator.clipboard.writeText(code).then(() => btn.textContent = "Copied");
  } else {
    msg.textContent = "No code received" + (err ? ": " + err + " (" + (q.get("error_description") || "") + ")" : ".");
  }
</script>
</body>
</html>
